# 用 Release 资产里的镜像 tar 推送到 ghcr（GITHUB_TOKEN，不依赖 PAT packages 权限）
name: push-ghcr-from-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "image tag"
        required: true
        default: "mvp"
      release_tag:
        description: "GitHub release tag holding atlasx-mvp.tar.gz"
        required: true
        default: "image-mvp"

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Download image tarball from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${{ inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "atlasx-mvp.tar.gz" \
            --dir /tmp
          ls -lh /tmp/atlasx-mvp.tar.gz

      - name: Load, tag, push to ghcr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker load -i /tmp/atlasx-mvp.tar.gz
          TAG="${{ inputs.tag }}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/atlasx"
          docker tag atlasx:mvp "${IMAGE}:${TAG}"
          docker tag atlasx:mvp "${IMAGE}:latest"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"
          docker logout ghcr.io
          echo "pushed ${IMAGE}:${TAG} and :latest"
