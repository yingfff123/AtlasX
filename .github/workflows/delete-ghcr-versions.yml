name: delete-ghcr-versions

on:
  workflow_dispatch:
    inputs:
      package:
        description: "container package name (e.g. atlasx-docker)"
        required: true
        default: atlasx-docker
      confirm:
        description: "type DELETE to confirm"
        required: true

permissions:
  packages: write
  contents: read

jobs:
  delete:
    if: github.event.inputs.confirm == 'DELETE'
    runs-on: ubuntu-latest
    steps:
      - name: Delete package (all versions)
        env:
          GH_TOKEN: ${{ github.token }}
          PKG: ${{ github.event.inputs.package }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          BASE=""
          for owner_path in \
            "user/packages/container/${PKG}" \
            "users/${OWNER}/packages/container/${PKG}"
          do
            if gh api "${owner_path}" --jq .name >/dev/null 2>&1; then
              BASE="$owner_path"
              break
            fi
          done
          if [[ -z "${BASE}" ]]; then
            echo "package already gone or not found: $PKG"
            exit 0
          fi
          echo "Found $BASE — listing versions then deleting entire package"
          gh api "${BASE}/versions?per_page=100" --jq '.[] | {id, tags: .metadata.container.tags}' || true
          # delete versions that are not the last tagged one first
          ids="$(gh api "${BASE}/versions?per_page=100" --jq '.[].id')"
          count=$(echo "$ids" | grep -c . || true)
          echo "version_count=$count"
          if [[ "$count" -gt 1 ]]; then
            # delete all but keep trying; last tagged needs package delete
            for id in $ids; do
              echo "try delete version $id"
              gh api --method DELETE "${BASE}/versions/${id}" || true
            done
          fi
          echo "DELETE entire package $BASE"
          gh api --method DELETE "$BASE"
          echo done
