# 构建并推送 ghcr.io/yingfff123/atlasx（MVP 过渡镜像）
# 密钥仅来自 GitHub Actions secrets，绝不 echo / 写入镜像 ARG

name: build-ghcr

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile.mvp"
      - "Dockerfile"
      - ".github/workflows/build-ghcr.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v4

      - name: Checkout AtlasX source (sibling)
        uses: actions/checkout@v4
        with:
          repository: yingfff123/AtlasX
          path: AtlasX
          token: ${{ secrets.GHCR_TOKEN }}

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./AtlasX
          file: ./Dockerfile.mvp
          push: true
          tags: |
            ghcr.io/yingfff123/atlasx:mvp
            ghcr.io/yingfff123/atlasx:latest
          # 无 build-args 传 token
