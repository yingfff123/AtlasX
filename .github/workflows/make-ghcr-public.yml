name: make-ghcr-public

on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  visibility:
    runs-on: ubuntu-latest
    steps:
      - name: Set atlasx package public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # user namespace package
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/atlasx/visibility" \
            -f visibility=public
          gh api "/user/packages/container/atlasx" --jq '{name,visibility,html_url}'
