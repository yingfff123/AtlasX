name: push-ghcr-repo-linked

on:
  workflow_dispatch:
    inputs:
      release_tag:
        default: "image-mvp"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Download tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "atlasx-mvp.tar.gz" --dir /tmp

      - name: Load and push as repo-linked package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker load -i /tmp/atlasx-mvp.tar.gz
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          # GHCR 仓库名必须全小写
          IMAGE="ghcr.io/${OWNER}/atlasx-docker"
          SHORT="ghcr.io/${OWNER}/atlasx"
          docker tag atlasx:mvp "${IMAGE}:mvp"
          docker tag atlasx:mvp "${IMAGE}:latest"
          docker tag atlasx:mvp "${SHORT}:mvp"
          docker tag atlasx:mvp "${SHORT}:latest"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${IMAGE}:mvp"
          docker push "${IMAGE}:latest"
          docker push "${SHORT}:mvp"
          docker push "${SHORT}:latest"
          docker logout ghcr.io
          echo "pushed ${IMAGE} and ${SHORT}"

      - name: Prefer public visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          for name in atlasx-docker atlasx; do
            echo "try visibility $name"
            gh api --method PUT \
              -H "Accept: application/vnd.github+json" \
              "/user/packages/container/${name}/visibility" \
              -f visibility=public && echo OK_$name && exit 0
          done
          echo "WARN: set package Public in GitHub UI if API 404"
          exit 0
