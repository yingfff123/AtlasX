# 阶段 O / 已发版：仅 pull，不在构建时接触 GitHub PAT
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar}
      POSTGRES_DB: ${POSTGRES_DB:-radar}
    volumes:
      - atlasx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    # 故意不 publish 5432

  web:
    image: ${ATLASX_IMAGE:-ghcr.io/yingfff123/atlasx}:${ATLASX_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    ports:
      - "${ATLASX_HTTP_PORT:-8000}:8000"
    command:
      [
        "uvicorn",
        "radar.server.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]

  worker:
    image: ${ATLASX_IMAGE:-ghcr.io/yingfff123/atlasx}:${ATLASX_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    command: ["radar", "worker"]

volumes:
  atlasx_pgdata:
