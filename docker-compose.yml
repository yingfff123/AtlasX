# 发版默认：pull GHCR，不在用户机编译
# web/worker 必须同 .env 中的 RADAR_MACHINE_ID
services:
  db:
    image: ${POSTGRES_IMAGE:-docker.m.daocloud.io/library/postgres:16}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar}
      POSTGRES_DB: ${POSTGRES_DB:-radar}
    volumes:
      - atlasx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    # 故意不 publish 5432

  web:
    image: ${ATLASX_IMAGE:-ghcr.io/yingfff123/atlasx-docker}:${ATLASX_IMAGE_TAG:-0.2.8}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      RADAR_ENGINE_DIR: /var/atlasx/engine
      RADAR_DATABASE_URL: ${RADAR_DATABASE_URL:-postgresql+psycopg://radar:radar@db:5432/radar}
    ports:
      - "${ATLASX_HTTP_PORT:-8000}:8000"
    volumes:
      - atlasx_engine:/var/atlasx/engine
      - atlasx_updates:/app/var/updates
      - atlasx_var:/app/var
    command:
      [
        "uvicorn",
        "radar.server.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]

  worker:
    image: ${ATLASX_IMAGE:-ghcr.io/yingfff123/atlasx-docker}:${ATLASX_IMAGE_TAG:-0.2.8}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      RADAR_ENGINE_DIR: /var/atlasx/engine
      RADAR_DATABASE_URL: ${RADAR_DATABASE_URL:-postgresql+psycopg://radar:radar@db:5432/radar}
    volumes:
      - atlasx_engine:/var/atlasx/engine
      - atlasx_updates:/app/var/updates
      - atlasx_var:/app/var
    # ksubdomain 原生爆破需要 raw/pcap；无此能力时采集器自动 DNS 回退
    cap_add:
      - NET_RAW
      - NET_ADMIN
    command: ["radar", "worker"]

volumes:
  atlasx_pgdata:
  atlasx_engine:
  atlasx_updates:
  atlasx_var:
