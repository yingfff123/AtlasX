# 阶段 M：从旁路主仓 build（路径由 .env 中 ATLASX_ROOT / ATLASX_DOCKER_ROOT 提供）
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar}
      POSTGRES_DB: ${POSTGRES_DB:-radar}
    volumes:
      - atlasx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ${ATLASX_ROOT:?set ATLASX_ROOT to sibling AtlasX path}
      dockerfile: ${ATLASX_DOCKER_ROOT:?}/Dockerfile.mvp
    image: atlasx:mvp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    ports:
      - "${ATLASX_HTTP_PORT:-8000}:8000"
    command:
      [
        "uvicorn",
        "radar.server.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]

  worker:
    image: atlasx:mvp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    env_file: .env
    command: ["radar", "worker"]

volumes:
  atlasx_pgdata:
